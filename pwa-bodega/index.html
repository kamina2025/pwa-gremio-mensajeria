<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protocolo Macondo - Terminal Bodega</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/billetera-bodega.css" />
  </head>
  <body>
    <header class="panel-negocios header-consola">
      <div class="meta-sistema">
        <span style="color: var(--neon-purple)" id="txt-nodo-id">[MACONDO_AUTH_REQUIRED]</span>
        <span id="reloj-nodo">00:00:00 UTC_NODE</span>
      </div>
      <h1 id="titulo-central-nodo">TERMINAL_DE_SOBERANIA_BODEGA</h1>
    </header>

    <!-- PANTALLA DE AUTENTICACIÓN NODAL (Inyectada desde vistas/auth-bloqueo.html) -->
    <main id="vista-bloqueo-seguro"></main>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="barra-pestanas-macondo" id="menu-navegacion-principal" style="display: none">
      <button class="btn-pestana activa" onclick="conmutarPestanaMacondo('pestana-indexar', this)">
        [01] CREAR_PUNTOS
      </button>
      <button class="btn-pestana" onclick="conmutarPestanaMacondo('pestana-monitorear', this)">
        [02] MONITOREAR_POOL
      </button>
      <button class="btn-pestana" onclick="conmutarPestanaMacondo('pestana-billetera', this)">
        [03] BILLETERA_NODAL
      </button>
    </nav>

    <!-- MODULO DE OPERACIONES CENTRAL -->
    <main id="modulo-operaciones-central" style="padding-top: 15px; display: none">
      <div id="pestana-indexar" class="contenedor-pestana activa">
        <div class="stepper-header">
          <div class="step-item active" id="indicator-step-1" onclick="cambiarPasoGuiado(1)">
            <span class="step-num">PASO 01</span>
            <span class="step-lbl">FUENTES DATOS</span>
          </div>
          <div class="step-item" id="indicator-step-2" onclick="cambiarPasoGuiado(2)">
            <span class="step-num">PASO 02</span>
            <span class="step-lbl">ENLISTAMIENTO</span>
          </div>
          <div class="step-item" id="indicator-step-3" onclick="cambiarPasoGuiado(3)">
            <span class="step-num">PASO 03</span>
            <span class="step-lbl">ZONAS & MAPA</span>
          </div>
          <div class="step-item" id="indicator-step-4" onclick="cambiarPasoGuiado(4)">
            <span class="step-num">PASO 04</span>
            <span class="step-lbl">DESPACHO FLOTA</span>
          </div>
        </div>
      </div>
    </main>
    <!-- DENTRO DEL SECCIÓN #paso-4-asignacion EN index.html -->

<details style="background: #0c080f; border: 1px solid var(--neon-purple); padding: 12px; margin-bottom: 15px;">
  <summary style="color: var(--neon-purple); font-weight: bold; cursor: pointer;">
    [🚴] GESTIONAR MENSAJEROS Y FLOTA ACTIVA
  </summary>
  
  <form id="form-agregar-mensajero" onsubmit="event.preventDefault(); const n=document.getElementById('m-nombre').value; const t=document.getElementById('m-tel').value; const v=document.getElementById('m-veh').value; const z=document.getElementById('m-zona').value; agregarMensajero(n,t,v,z); this.reset();" style="margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px;">
    <input type="text" id="m-nombre" class="input-maquina" placeholder="Nombre Mensajero" required />
    <input type="text" id="m-tel" class="input-maquina" placeholder="Teléfono (Ej: 3001234567)" required />
    <input type="text" id="m-veh" class="input-maquina" placeholder="Vehículo / Placa" value="Moto" />
    <select id="m-zona" class="input-maquina">
      <option value="TODAS">Todas las Zonas</option>
      <option value="ZONA NORTE 1">Zona Norte 1</option>
      <option value="ZONA NORTE 2">Zona Norte 2</option>
      <option value="ZONA CENTRO">Zona Centro</option>
      <option value="ZONA OESTE">Zona Oeste</option>
      <option value="ZONA SUR 1">Zona Sur 1</option>
      <option value="ZONA SUR 2">Zona Sur 2</option>
    </select>
    <button type="submit" class="btn-terminal" style="border-color: var(--neon-green); color: var(--neon-green); grid-column: 1 / -1;">
      [+] REGISTRAR MENSAJERO EN FLOTA
    </button>
  </form>

  <div style="margin-top: 12px; overflow-x: auto;">
    <table class="tabla-maquina" style="font-size: 0.75rem;">
      <thead>
        <tr>
          <th>ID</th>
          <th>NOMBRE</th>
          <th>TELÉFONO</th>
          <th>VEHÍCULO</th>
          <th>ACCIONES</th>
        </tr>
      </thead>
      <tbody id="tabla-flota-body">
        <!-- Renderizado dinámico desde flota-mensajeros.js -->
      </tbody>
    </table>
  </div>
</details>

<script type="module">
  import { renderizarTablaFlotaUI } from './modulos/flota-mensajeros.js';
  document.addEventListener("DOMContentLoaded", () => {
    renderizarTablaFlotaUI();
  });
</script>

    <footer class="barra-estado">
      <span id="txt-signature-footer">BODEGA_NODE_KEY: AUTH_PENDING</span>
      <span class="indicador-red">[XAMPP_LOCAL_SERVER]</span>
    </footer>

    <!-- SUBSISTEMAS MACONDO -->
    <script src="modulos/visor-animaciones.js"></script>
    <script src="modulos/config.js"></script>
    <!-- SUBSISTEMA DE ZONIFICACIÓN Y MAPAS -->
    <script type="module" src="modulos/mapa-zonas.js"></script>
    <script src="modulos/maps.js"></script>
    <script src="modulos/masa-sensor.js"></script>
    <script src="modulos/indexador-pedidos.js"></script>
    <script type="module" src="modulos/importador-masivo.js"></script>
    <script type="module" src="modulos/tablero-bodega.js"></script>
    <script type="module" src="modulos/billetera-ui.js"></script>
    <script src="modulos/cedula-nodal.js"></script>
    <script src="modulos/pool-persistencia.js"></script>
    <script src="modulos/interface.js"></script>
    <script src="modulos/crypto.js"></script>
    <script src="modulos/ai-agent.js"></script>

    <!-- GOOGLE MAPS API -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCP6Wc3JRQIRXu6cXM8KkPasuy8asTIWUE&callback=inicializarMapaMacondo&libraries=places"
      async
      defer></script>

    <!-- BOOTSTRAPPER ASÍNCRONO SIN RACE CONDITIONS -->
    <script type="module">
      import { cargarComponentesHTML } from "./modulos/layout-loader.js";
      import { verificarAccesoCedulaAlArranque } from "./modulos/billetera-ui.js";

      window.onload = async () => {
        // 1. Esperar el ensamblado completo de vistas HTML
        await cargarComponentesHTML();

        // 2. Enlazar listeners dinámicos del importador masivo en el DOM listo
        if (window.ImportadorMasivoBodega) {
          window.ImportadorMasivoBodega.vincularEscuchas();
        }

        // 3. Inicializar el renderizado del mapa de telemetría si ya cargó Google Maps
        if (typeof window.inicializarMapaMacondo === "function") {
          window.inicializarMapaMacondo();
        }

        // 4. Validar Cédula y sesión
        verificarAccesoCedulaAlArranque();
      };
    </script>
  </body>
</html>
