<section id="paso-2-enlistamiento" class="paso-panel panel-negocios" style="display: none">
  <h2>[2] PASO 2: PROCESAMIENTO, REVISIÓN Y REGISTRO DE DATOS</h2>

  <details style="margin-bottom: 15px; border: 1px solid var(--border-color); padding: 10px; background: #0c080f">
    <summary style="color: var(--neon-green); cursor: pointer; font-weight: bold">[+] AGREGAR PUNTO INDIVIDUAL MANUALMENTE</summary>
    <form id="formulario-pedido" onsubmit="agregarPedidoALote(event)" style="margin-top: 10px">
      <div class="grid-formulario">
        <div class="campo-maquina-hibrido">
          <label class="label-maquina">ORIGEN BODEGA:</label>
          <div class="input-con-boton">
            <input type="text" class="input-maquina" id="origen-cliente" required readonly />
            <button type="button" class="btn-terminal" onclick="localizarDireccionTexto('origen-cliente')">IR</button>
          </div>
        </div>
        <div class="campo-maquina">
          <label class="label-maquina">ALIAS DEL PUNTO (Nombre/Ref):</label>
          <input type="text" class="input-maquina" id="doc-cliente" placeholder="Ej: Punto Drop-Off Norte" />
        </div>
        <div class="campo-maquina-hibrido">
          <label class="label-maquina">DIRECCIÓN PUNTUAL (Destino):</label>
          <div class="input-con-boton">
            <input type="text" class="input-maquina" id="dir-cliente" placeholder="Ej: Av 6N # 25-10" />
            <button type="button" class="btn-terminal" onclick="localizarDireccionTexto('dir-cliente')">IR</button>
          </div>
        </div>
        <div class="campo-maquina">
          <label class="label-maquina">TELÉFONO ENCARGADO:</label>
          <input type="tel" class="input-maquina" id="tel-cliente" />
        </div>
        <div class="campo-maquina">
          <label class="label-maquina">MÉTRICA_CARGA (Detalle Carga):</label>
          <input type="text" class="input-maquina" id="carga-detalle" list="opciones-carga-estandar" />
          <datalist id="opciones-carga-estandar">
            <option value="Paquete Estándar (1.0 kg)"></option>
            <option value="Lote Consolidado (10.0 kg)"></option>
          </datalist>
        </div>
      </div>
      <div class="bloque-hash-foto" style="margin-top: 15px">
        <div class="input-file-contenedor">
          <input type="file" id="foto-paquete" accept="image/*" onchange="simularHashFoto()" />
          <span id="txt-hash-foto" class="txt-consola-info">PENDIENTE: Capturar testigo óptico del punto/paquete...</span>
        </div>
      </div>
      <button type="submit" class="btn-terminal btn-agregar-lote" style="margin-top: 10px">
        + REGISTRAR PUNTO MANUAL (CONSUMO: 1 CRÉDITO)
      </button>
    </form>
  </details>

  <div class="tabla-contenedor-scroller">
    <table class="tabla-maquina">
      <thead>
        <tr>
          <th>HASH_ID</th>
          <th>ALIAS_PUNTO</th>
          <th>DIRECCIÓN</th>
          <th>DETALLE</th>
          <th>MÉTRICA</th>
          <th>TARIFA_API</th>
          <th>ASIGNACIÓN</th>
          <th>TESTIGO</th>
        </tr>
      </thead>
      <tbody id="cola-pedidos-body">
        <tr id="fila-vacia">
          <td colspan="8" style="text-align: center; color: var(--neon-amber); padding: 15px">
            [BUFFER VACÍO] Cargue datos en el Paso 1 para enlistar la matriz.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="acciones-paso flex-between" style="display: flex; justify-content: space-between; margin-top: 15px">
    <button class="btn-terminal" style="border-color: #666; color: #ccc" onclick="cambiarPasoGuiado(1)">⬅ Volver a Fuente de Datos</button>
    <button class="btn-terminal" style="border-color: var(--neon-blue); color: var(--neon-blue)" onclick="cambiarPasoGuiado(3)">Paso 3: Ver Mapa & Rutas ➔</button>
  </div>
</section>
