<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>Runner - Mensajero</title>

        <!-- Enlace al Web App Manifest -->
        <link rel="manifest" href="./manifest.json" />

        <!-- Iconos y Fuentes -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

        <!-- Estilos Modulares de la PWA Cyberpunk -->
        <link rel="stylesheet" href="./style/style2.css" />
        <link rel="stylesheet" href="./style/layout.css" />
        <link rel="stylesheet" href="./style/sidebar.css" />
        <link rel="stylesheet" href="./style/formularios.css" />
        <link rel="stylesheet" href="./style/botones-contenedor.css" />
        <link rel="stylesheet" href="./style/barra-inferior.css" />

        <!-- Librerías de Ingestión Local sin servidor/IA -->
        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

        <!-- Puente para exposición global de la callback de Google Maps -->
        <script>
            console.log("🚀 [INDEX2]: Inicializando puente de callback Google Maps");
            window.inicializarMapaMensajero = function () {
                console.log("🗺️ [MAPA_CALLBACK_BRIDGE]: Google Maps SDK listo. Delegando a módulo...");
                if (window.inicializarMapaMensajeroModulo) {
                    window.inicializarMapaMensajeroModulo();
                }
            };
        </script>
    </head>
    <body>
        <!-- Cabecera Principal (Header Grid Area) -->
        <header class="header-principal">
            <button id="toggle-menu-btn" class="nav-btn">
                <i class="fa-solid fa-bars"></i>
                <span>_MENU</span>
            </button>
            <div class="logo">RUNNER</div>
            <button id="install-btn" class="nav-btn">_INSTALAR_PWA</button>
        </header>

        <!-- Contenedor Principal del Dashboard (Grid de 2 Columnas) -->
        <div class="dashboard-container">
            <!-- Componente de Barra Lateral (Sidebar Area) -->
            <div data-include="componentes/siderbar.html"></div>

            <!-- Contenedor de Vistas y Pestañas (Main Area) -->
            <main class="main-content main-container">
                <!-- Vista: Ruta Activa -->
                <div
                    id="pestana-ruta-activa"
                    class="contenedor-pestana activa"
                    data-include="vistas/ruta/ruta-activa.html"></div>

                <div id="pestana-ruta-crear" class="contenedor-pestana" data-include="vistas/ruta/crear.html"></div>

                <div
                    id="mapa-fullscreen-container"
                    class="contenedor-pestana"
                    data-include="vistas/ruta/mapa-activa.html"></div>

                <!-- Submenú de Monedero -->
                <div
                    id="pestana-monedero-historial"
                    class="contenedor-pestana"
                    data-include="vistas/monedero/historial.html"></div>

                <div
                    id="pestana-monedero-saldo"
                    class="contenedor-pestana"
                    data-include="vistas/monedero/saldo.html"></div>

                <!-- Menú de Reportes y Planillas -->
                <div
                    id="pestana-notificaciones-planillas"
                    class="contenedor-pestana"
                    data-include="vistas/notificaciones/planillas.html"></div>

                <div
                    id="pestana-notificaciones-reportes"
                    class="contenedor-pestana"
                    data-include="vistas/notificaciones/reportes.html"></div>

                <!-- Perfil del Conductor y Vehículo -->
                <div
                    id="pestana-perfil-conductor"
                    class="contenedor-pestana"
                    data-include="vistas/perfil/conductor.html"></div>
            </main>
        </div>

        <!-- CONTENEDOR DE BARRA INFERIOR FLOTANTE A NIVEL RAÍZ -->
        <nav id="contenedor-menu" class="barra-inferior-global"></nav>

        <!-- PORTALES DE UI CYBERPUNK (Toasts & Modales de Proceso) -->
        <div id="cyber-toast-container" class="cyber-toast-container" aria-live="polite" aria-atomic="true"></div>

        <div id="cyber-modal-overlay" class="cyber-modal-overlay hidden" role="dialog" aria-modal="true">
            <div class="cyber-modal-card" id="cyber-modal-card"></div>
        </div>

        <script>
            window.cargarBarraInferior = function (rutaComponente) {
                console.log(`[INDEX2] Cargando barra inferior desde: ${rutaComponente}`);
                const contenedor = document.getElementById("contenedor-menu");
                if (!contenedor) return;

                if (contenedor.dataset.componenteActual === rutaComponente) return;

                fetch(rutaComponente)
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`Error HTTP: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then((html) => {
                        contenedor.innerHTML = html;
                        contenedor.dataset.componenteActual = rutaComponente;
                    })
                    .catch((error) => console.error("[INDEX2] Error al cargar la barra inferior:", error));
            };

            document.addEventListener("DOMContentLoaded", () => {
                console.log("[INDEX2] Evento DOMContentLoaded detectado.");
                window.cargarBarraInferior("componentes/barra-inferior/inicio-barra-infe.html");
            });
        </script>

        <!-- Módulos de Control JavaScript -->
        <script src="./app.js"></script>

        <!-- Carga como módulos ES6 para soportar la palabra reservada 'export' -->
        <script type="module" src="./modulos/ui/avisos/visor-animaciones.js"></script>
        <script type="module" src="./modulos/ui/avisos/avisos-controller.js"></script>
        <script type="module" src="./modulos/mensajero-ui.js"></script>

        <!-- SDK de Mapas -->
        <script
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCP6Wc3JRQIRXu6cXM8KkPasuy8asTIWUE&callback=inicializarMapaMensajero&libraries=places&loading=async"
            async
            defer></script>

        <!-- Orquestador Principal ES6 Module -->
        <script type="module" src="./script2.js"></script>
    </body>
</html>
