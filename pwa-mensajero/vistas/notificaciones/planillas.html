<!-- Navegación por pestañas internas -->
<div class="tabs-header-cyber">
    <button class="tab-btn active" data-tab="tab-generar-planilla" onclick="cambiarPestanaPlanillas('tab-generar-planilla')">
        _GENERAR_PLANILLA
    </button>
    <button class="tab-btn" data-tab="tab-planillas-reportadas" onclick="cambiarPestanaPlanillas('tab-planillas-reportadas')">
        _PLANILLAS_REPORTADAS
    </button>
</div>

<!-- Pestaña 1: Generación de Planilla -->
<div id="tab-generar-planilla" class="tab-content active">
    <header class="cyber-header flex-between">
        <h3>_GENERACIÓN DE PLANILLAS ZONIFICADAS</h3>
        <button class="tab-btn" onclick="renderizarModuloPlanillas()">
            <i class="fa-solid fa-rotate-right"></i> _ACTUALIZAR_ZONAS
        </button>
    </header>
    <div class="panel-contenido">
        <p class="cyber-text">Seleccione los envíos o confirme la zona para conformar y emitir la planilla oficial en PDF.</p>
        
        <!-- CONTENEDOR DINÁMICO CON SCROLLMASTER UNIFICADO Y PADDING DE SEGURIDAD -->
        <div id="contenedor-planillado-zonas" class="zonas-accordion-container cyber-scroll-container" style="margin-top: 15px;">
            <div class="text-center text-muted" style="padding: 20px;">
                🔍 Cargando zonas pendientes para planillar...
            </div>
        </div>
    </div>
</div>

<!-- Pestaña 2: Planillas Reportadas Historial -->
<div id="tab-planillas-reportadas" class="tab-content">
    <header class="cyber-header flex-between">
        <h3>_PLANILLAS_REPORTADAS_HISTORIAL</h3>
        <button id="btn-rescanalizar-planillas" class="cyber-btn btn-sm" onclick="cargarPlanillasReportadasUI()">
            <i class="fa-solid fa-rotate-right"></i> _RESCANALIZAR
        </button>
    </header>

    <div class="tabla-contenedor-cyber">
        <table class="tabla-cyber">
            <thead>
                <tr>
                    <th>SCC / SEGUIMIENTO</th>
                    <th>FECHA</th>
                    <th>ESTADO SCC</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tabla-planillas-reportadas-body">
                <tr>
                    <td colspan="4" class="text-center">Cargando datos del nodo local...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
