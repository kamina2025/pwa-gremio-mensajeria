<!-- Navegación por pestañas internas -->

        _GENERAR_PLANILLA
    </button>
    <button class="tab-btn" data-tab="tab-planillas-reportadas" onclick="cambiarPestanaPlanillas('tab-planillas-reportadas')">

</div>
