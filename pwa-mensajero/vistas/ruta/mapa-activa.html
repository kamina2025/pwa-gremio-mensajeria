<!-- ==========================================================================
   PROTOCOLO MACONDO - VISTA COMPLETA DEL MAPA INTERACTIVO
   Ubicación: vistas/ruta/mapa-activa.html
   ========================================================================== -->
<div class="cyber-map-container">
    
    <!-- ⚡ BUSCADOR FLOTANTE DUAL CON LISTA DESPLEGABLE DE SUGERENCIAS -->
    <div class="cyber-search-wrapper" id="cyber-search-wrapper">
        <div class="cyber-search-input-box">
            <span class="cyber-search-icon">🔍</span>
            <input 
                type="text" 
                id="buscador-paradas-mapa" 
                placeholder="Buscar #Stop, cliente o dirección..." 
                autocomplete="off" 
                aria-label="Buscar paradas en el mapa"
            />
            <button type="button" id="btn-limpiar-busqueda" class="cyber-btn-clear" style="display:none;">✕</button>
        </div>
        <ul class="cyber-sugerencias-lista" id="sugerencias-paradas-mapa" style="display:none;"></ul>
    </div>

    <!-- 🎛️ CONTROLES VERTICALES FLOTANTES (ZOOM & LOCK) -->
    <div class="cyber-map-controls" id="cyber-map-controls">
        <button type="button" class="cyber-btn-map" id="btn-zoom-in" aria-label="Acercar mapa">
            <span class="cyber-btn-icon">➕</span>
        </button>
        <button type="button" class="cyber-btn-map" id="btn-zoom-out" aria-label="Alejar mapa">
            <span class="cyber-btn-icon">➖</span>
        </button>
        <button type="button" class="cyber-btn-map" id="btn-toggle-lock" aria-label="Bloquear/Desbloquear mapa" data-locked="false">
            <span class="cyber-btn-icon" id="icon-lock-state">🔓</span>
        </button>
    </div>

    <!-- 📋 TARJETA FLOTANTE DE DETALLE DE PARADA Y CÁLCULO DE PROXIMIDAD -->
    <div class="cyber-stop-card" id="tarjeta-detalle-parada" style="display:none;">
        <div class="cyber-card-header">
            <span class="cyber-card-badge" id="card-stop-secuencia">#STOP --</span>
            <span class="cyber-card-status" id="card-stop-estado">PENDIENTE</span>
            <button type="button" class="cyber-card-close" id="btn-cerrar-tarjeta">✕</button>
        </div>
        <div class="cyber-card-body">
            <h4 id="card-stop-destinatario">Nombre del Cliente</h4>
            <p id="card-stop-direccion">📍 Dirección de la parada</p>
            <p id="card-stop-telefono">📞 Teléfono</p>
        </div>
        <div class="cyber-card-footer">
            <span class="cyber-cercanas-title">⚡ 3 PARADAS MÁS CERCANAS:</span>
            <div class="cyber-cercanas-list" id="contenedor-paradas-cercanas"></div>
        </div>
    </div>

    <!-- 🗺️ LIENZO DE MAPA GOOGLE MAPS PANTALLA COMPLETA -->
    <div id="mapa-mensajero-view" class="mapa-canvas"></div>
</div>
