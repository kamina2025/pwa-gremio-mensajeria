<!-- ==========================================================================
     PROTOCOLO MACONDO - VISTA RUTA ACTIVA & ZONIFICACIÓN TÁCTICA
     Ubicación: pwa-mensajero/vistas/ruta/ruta-activa.html
     ========================================================================== -->

<!-- Hoja de Estilo Modularizada Cyberpunk -->
<link rel="stylesheet" href="style/ruta-activa.css" />

<div class="vista-header">
    <h2>// RUTAS_ACTIVAS</h2>
    <span class="badge-status online">EN LINEA</span>
</div>

<!-- CONTENEDOR PRINCIPAL DE LA RUTA -->
<div class="modulo-ruta-container">

    <!-- ACORDEÓN PARA CARGAR / PEGAR RUTA DESDE WHATSAPP O TELEGRAM -->
    <section class="panel-maquina" style="border-color: var(--neon-purple, #b359ff); margin-bottom: 12px">
        <details style="cursor: pointer">
            <summary style="color: var(--neon-purple, #b359ff); font-weight: bold; font-size: 0.85rem">
                [📥] CARGAR / PEGAR RUTA DESDE WHATSAPP O TELEGRAM
            </summary>
            <div style="margin-top: 10px">
                <label class="label-consola" style="font-size: 0.75rem; color: #aaa">
                    Pegue aquí la URL recibida por WhatsApp/Telegram o el manifiesto codificado:
                </label>
                <textarea
                    id="txt-payload-manual"
                    rows="3"
                    class="input-terminal"
                    placeholder="Ej: https://kamina2025.github.io/pwa-gremio-mensajeria/pwa-mensajero/?payload=%5B%7B..."></textarea>
                <button
                    type="button"
                    class="btn-terminal btn-crypto"
                    onclick="procesarCargaManualEnlace()"
                    style="margin-top: 6px; width: 100%">
                    [⚡] IMPORTAR Y ACTIVAR RUTA EN MI TERMINAL
                </button>
            </div>
        </details>
    </section>

    <!-- FORMULARIO ACORDEÓN PARA CREAR / EDITAR PARADA MANUALMENTE -->
    <section class="panel-maquina" style="border-color: var(--neon-green, #00ff66); margin-bottom: 12px">
        <details id="details-formulario-parada" style="cursor: pointer">
            <summary style="color: var(--neon-green, #00ff66); font-weight: bold; font-size: 0.85rem">
                [➕ / ✏️] GESTIÓN MANUAL DE PARADA (NUEVA O EDICIÓN)
            </summary>
            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px">
                <input type="hidden" id="edit-parada-id" value="" />

                <input
                    type="text"
                    id="edit-parada-destinatario"
                    class="input-terminal"
                    placeholder="Nombre Destinatario" />
                <input
                    type="text"
                    id="edit-parada-direccion"
                    class="input-terminal"
                    placeholder="Dirección de Entrega" />
                <input type="text" id="edit-parada-telefono" class="input-terminal" placeholder="Teléfono Contacto" />
                <input
                    type="text"
                    id="edit-parada-ssc"
                    class="input-terminal"
                    placeholder="SSC / No. Guía (Opcional)" />
                <input
                    type="text"
                    id="edit-parada-cuota"
                    class="input-terminal"
                    placeholder="Cuota Moderadora / Copago" />

                <div style="display: flex; gap: 8px; margin-top: 4px">
                    <button type="button" class="btn-terminal btn-crypto" onclick="guardarParadaManualUI()" style="flex: 1">
                        [💾] GUARDAR EN BASE LOCAL
                    </button>
                    <button type="button" class="btn-terminal btn-crypto" onclick="limpiarFormularioParadaUI()" style="flex: 1">
                        [CANCELAR]
                    </button>
                </div>
            </div>
        </details>
    </section>

    <!-- POOL DINÁMICA DE CONTRATOS DISPONIBLES -->
    <div id="pool-pedidos-dinamico" style="margin-bottom: 12px"></div>

    <!-- LISTA DE PARADAS ZONIFICADAS Y REORDENABLES CON ACORDEONES -->
    <section class="panel-maquina">
        <div class="header-status" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px">
            <span style="color: var(--neon-blue, #00e5ff); font-weight: bold">[📋] HOJA_DE_RUTA_ZONIFICADA</span>
            <div style="display: flex; gap: 6px; align-items: center">
                <span id="txt-total-paradas" style="margin-right: 4px; font-size: 0.8rem; color: #aaa">0 PARADAS</span>
                <button type="button" onclick="window.ejecutarZonificacionAutomatica()" class="btn-terminal btn-crypto" style="color: #00e5ff; border-color: #00e5ff">
                    [🎨 ZONIFICAR]
                </button>
                <button type="button" onclick="purgarTodaLaRutaUI()" class="btn-terminal btn-crypto" style="color: #ff3366; border-color: #ff3366">
                    [🗑️ BORRAR]
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DINÁMICO PARA TABLAS Y ACORDEONES POR ZONA -->
        <!-- Cada acordeón inyectará internamente la barra de acciones:
             [ ► _INICIAR ] [ ⚡ OPTIMIZAR PROXIMIDAD ] [ 📝 _PLANILLAR ] [ 🗺️ MAPA ] -->
        <div id="contenedor-acordeones-zonas" class="zonas-accordion-container" style="margin-top: 10px">
            <div id="lista-paradas-zonificadas" style="max-height: 450px; overflow-y: auto"></div>
        </div>
    </section>

</div>
