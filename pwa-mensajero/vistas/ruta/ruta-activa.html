<!-- ==========================================================================
     PROTOCOLO MACONDO - VISTA RUTA ACTIVA & ZONIFICACIÓN TÁCTICA
     Ubicación: pwa-mensajero/vistas/ruta/ruta-activa.html
     ========================================================================== -->

<!-- Hoja de Estilo Modularizada Cyberpunk -->
<link rel="stylesheet" href="style/ruta-activa.css" />

<!-- REGLAS DE INMUNIZACIÓN ESTRUCTURAL CONTRA STRINGS CORRUPTOS Y DESBORDAMIENTO -->
<style id="css-inmunizador-ruta-activa">
    /* Forzar quiebre de cadenas continuas e impedir desbordamiento horizontal */
    .cyber-scroll-container,
    #contenedor-acordeones-zonas,
    #lista-paradas-zonificadas,
    .acordeon-zona-item,
    .tarjeta-parada-item,
    .tarjeta-parada-row {
        max-width: 100% !important;
        overflow-x: hidden !important;
        overflow-wrap: anywhere !important;
        word-break: break-word !important;
    }

    /* Asignar min-width 0 a contenedores flexbox de texto para respetar el ancho restante */
    .parada-datos-bloque,
    .info-parada-item,
    .contenido-parada,
    .txt-direccion-parada,
    .txt-destinatario-parada {
        min-width: 0 !important;
        flex: 1 1 auto !important;
        overflow-wrap: anywhere !important;
        word-break: break-word !important;
    }

    /* Asegurar que la barra de botones mantenga su ancho estático y nunca colapse */
    .parada-acciones-bloque,
    .acciones-parada-row,
    .btn-grupo-acciones {
        flex-shrink: 0 !important;
        display: flex !important;
        gap: 4px !important;
        align-items: center !important;
        white-space: nowrap !important;
    }
</style>

<div class="vista-header">
    <h2>// RUTAS_ACTIVAS</h2>
    <span class="badge-status online">EN LINEA</span>
</div>

<!-- CONTENEDOR PRINCIPAL DE LA RUTA -->
<div class="modulo-ruta-container" style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 100%; overflow: hidden;">

    <!-- BARRA DE ACCIONES RÁPIDAS (BOTONES DE APERTURA DE MODALES) -->
    <section class="panel-maquina" style="display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0;">
        <button 
            type="button" 
            class="btn-terminal btn-crypto" 
            onclick="window.mostrarModalImportarRutaUI()" 
            style="flex: 1; min-width: 180px; color: var(--neon-purple, #b359ff); border-color: var(--neon-purple, #b359ff);">
            [📥] IMPORTAR RUTA (WA / TELEGRAM)
        </button>
        <button 
            type="button" 
            class="btn-terminal btn-crypto" 
            onclick="window.mostrarModalGestionParadaUI()" 
            style="flex: 1; min-width: 180px; color: var(--neon-green, #00ff66); border-color: var(--neon-green, #00ff66);">
            [➕ / ✏️] GESTIÓN MANUAL DE PARADA
        </button>
    </section>

    <!-- MODAL 1: CARGAR / PEGAR RUTA DESDE WHATSAPP O TELEGRAM -->
    <dialog id="modal-importar-ruta" class="panel-maquina" style="border-color: var(--neon-purple, #b359ff); max-width: 500px; width: 90%; margin: auto; padding: 15px; background: rgba(10, 10, 15, 0.95); color: #fff;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--neon-purple, #b359ff); padding-bottom: 6px;">
            <span style="color: var(--neon-purple, #b359ff); font-weight: bold; font-size: 0.9rem;">
                [📥] CARGAR / PEGAR RUTA DESDE WHATSAPP O TELEGRAM
            </span>
            <button type="button" onclick="window.cerrarModalImportarRutaUI()" style="background: transparent; border: none; color: #ff3366; font-weight: bold; cursor: pointer; font-size: 1.1rem;">[X]</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="label-consola" style="font-size: 0.75rem; color: #aaa">
                Pegue aquí la URL recibida por WhatsApp/Telegram o el manifiesto codificado:
            </label>
            <textarea
                id="txt-payload-manual"
                rows="4"
                class="input-terminal"
                placeholder="Ej: https://kamina2025.github.io/pwa-gremio-mensajeria/pwa-mensajero/?payload=%5B%7B..."></textarea>
            <div style="display: flex; gap: 8px; margin-top: 6px;">
                <button
                    type="button"
                    class="btn-terminal btn-crypto"
                    onclick="window.ejecutarImportacionYRutaUI()"
                    style="flex: 2; color: var(--neon-purple, #b359ff); border-color: var(--neon-purple, #b359ff);">
                    [⚡] IMPORTAR Y ACTIVAR RUTA
                </button>
                <button
                    type="button"
                    class="btn-terminal btn-crypto"
                    onclick="window.cerrarModalImportarRutaUI()"
                    style="flex: 1; color: #aaa; border-color: #555;">
                    [CANCELAR]
                </button>
            </div>
        </div>
    </dialog>

    <!-- MODAL 2: CREAR / EDITAR PARADA MANUALMENTE (ESTANDARIZADO) -->
    <dialog id="modal-gestion-parada" class="panel-maquina" style="border-color: var(--neon-green, #00ff66); max-width: 500px; width: 90%; margin: auto; padding: 15px; background: rgba(10, 10, 15, 0.95); color: #fff;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--neon-green, #00ff66); padding-bottom: 6px;">
            <span style="color: var(--neon-green, #00ff66); font-weight: bold; font-size: 0.9rem;">
                [➕ / ✏️] GESTIÓN MANUAL DE PARADA
            </span>
            <button type="button" onclick="window.cerrarModalGestionParadaUI()" style="background: transparent; border: none; color: #ff3366; font-weight: bold; cursor: pointer; font-size: 1.1rem;">[X]</button>
        </div>
        <form id="form-gestion-parada" style="display: flex; flex-direction: column; gap: 8px" onsubmit="event.preventDefault(); window.guardarYcerrarParadaManualUI();">
            <input type="hidden" id="input-parada-id" name="input-parada-id" value="" />

            <input
                type="text"
                id="input-parada-cliente"
                name="input-parada-cliente"
                class="input-terminal"
                placeholder="Nombre Destinatario / Cliente"
                required />
            <input
                type="text"
                id="input-parada-direccion"
                name="input-parada-direccion"
                class="input-terminal"
                placeholder="Dirección de Entrega"
                required />
            <input 
                type="text" 
                id="input-parada-telefono" 
                name="input-parada-telefono"
                class="input-terminal" 
                placeholder="Teléfono Contacto" />
            <input
                type="text"
                id="input-parada-ssc"
                name="input-parada-ssc"
                class="input-terminal"
                placeholder="SSC / No. Guía (Opcional)" />
            <input
                type="text"
                id="input-parada-cuota"
                name="input-parada-cuota"
                class="input-terminal"
                placeholder="Cuota Moderadora / Copago" />
            <input
                type="text"
                id="input-parada-zona"
                name="input-parada-zona"
                class="input-terminal"
                placeholder="Zona (Ej: NORTE-1, CENTRO, SUR-2)" />
            <textarea
                id="input-parada-observaciones"
                name="input-parada-observaciones"
                rows="2"
                class="input-terminal"
                placeholder="Observaciones / Notas adicionales"></textarea>

            <div style="display: flex; gap: 8px; margin-top: 6px">
                <button type="submit" class="btn-terminal btn-crypto" style="flex: 1; color: var(--neon-green, #00ff66); border-color: var(--neon-green, #00ff66);">
                    [💾] GUARDAR EN BASE LOCAL
                </button>
                <button type="button" class="btn-terminal btn-crypto" onclick="window.cerrarModalGestionParadaUI()" style="flex: 1; color: #aaa; border-color: #555;">
                    [CANCELAR]
                </button>
            </div>
        </form>
    </dialog>

    <!-- POOL DINÁMICA DE CONTRATOS DISPONIBLES -->
    <div id="pool-pedidos-dinamico" style="flex-shrink: 0;"></div>

    <!-- LISTA DE PARADAS ZONIFICADAS -->
    <section class="panel-maquina" style="display: flex; flex-direction: column; min-height: 0; overflow: hidden; max-width: 100%;">
        <div class="header-status" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; flex-shrink: 0;">
            <span style="color: var(--neon-blue, #00e5ff); font-weight: bold">[📋] HOJA_DE_RUTA_ZONIFICADA</span>
            <div style="display: flex; gap: 6px; align-items: center">
                <span id="txt-total-paradas" style="margin-right: 4px; font-size: 0.8rem; color: #aaa">0 PARADAS</span>
                <button type="button" onclick="window.ejecutarZonificacionAutomatica()" class="btn-terminal btn-crypto" style="color: #00e5ff; border-color: #00e5ff">
                    [🎨 ZONIFICAR]
                </button>
                <button type="button" onclick="window.purgarTodaLaRutaUI()" class="btn-terminal btn-crypto" style="color: #ff3366; border-color: #ff3366">
                    [🗑️ BORRAR]
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DESPLAZABLE ÚNICO (SCROLLMASTER) SIN SCROLLS ANIDADOS -->
        <div id="contenedor-acordeones-zonas" class="cyber-scroll-container" style="overflow-x: hidden; overflow-y: auto; max-width: 100%;">
            <div id="lista-paradas-zonificadas" style="max-width: 100%; overflow-x: hidden; word-break: break-word;"></div>
        </div>
    </section>

</div>

<!-- SCRIPT DE INMUNIZACIÓN INMEDIATA CONTRA RACES DE CARGA DE MÓDULOS -->
<script>
    (function () {
        console.log("🛡️ [INMUNIZADOR_INLINE]: Verificando inicialización de bindings UI...");

        if (typeof window.mostrarModalGestionParadaUI !== "function") {
            window.mostrarModalGestionParadaUI = function (datosParada) {
                console.log("🛡️ [INMUNIZADOR_INLINE]: Desplegando #modal-gestion-parada");
                if (typeof window.precargarFormularioParadaUI === "function" && datosParada) {
                    window.precargarFormularioParadaUI(datosParada);
                }
                const m = document.getElementById('modal-gestion-parada');
                if (m) {
                    m.classList.add("active");
                    typeof m.showModal === 'function' ? m.showModal() : m.style.display = 'block';
                }
            };
        }

        if (typeof window.cerrarModalGestionParadaUI !== "function") {
            window.cerrarModalGestionParadaUI = function () {
                console.log("🛡️ [INMUNIZADOR_INLINE]: Cerrando #modal-gestion-parada");
                if (typeof window.limpiarFormularioParadaUI === "function") {
                    window.limpiarFormularioParadaUI();
                }
                const m = document.getElementById('modal-gestion-parada');
                if (m) {
                    m.classList.remove("active");
                    typeof m.close === 'function' ? m.close() : m.style.display = 'none';
                }
            };
        }

        if (typeof window.mostrarModalImportarRutaUI !== "function") {
            window.mostrarModalImportarRutaUI = function () {
                console.log("🛡️ [INMUNIZADOR_INLINE]: Desplegando #modal-importar-ruta");
                const m = document.getElementById('modal-importar-ruta');
                if (m) {
                    m.classList.add("active");
                    typeof m.showModal === 'function' ? m.showModal() : m.style.display = 'block';
                }
            };
        }

        if (typeof window.cerrarModalImportarRutaUI !== "function") {
            window.cerrarModalImportarRutaUI = function () {
                console.log("🛡️ [INMUNIZADOR_INLINE]: Cerrando #modal-importar-ruta");
                const m = document.getElementById('modal-importar-ruta');
                if (m) {
                    m.classList.remove("active");
                    typeof m.close === 'function' ? m.close() : m.style.display = 'none';
                }
            };
        }

        if (typeof window.ejecutarImportacionYRutaUI !== "function") {
            window.ejecutarImportacionYRutaUI = async function () {
                if (typeof window.procesarCargaManualEnlace === 'function') {
                    await window.procesarCargaManualEnlace();
                }
                window.cerrarModalImportarRutaUI();
            };
        }

        if (typeof window.guardarYcerrarParadaManualUI !== "function") {
            window.guardarYcerrarParadaManualUI = async function () {
                if (typeof window.guardarParadaManualUI === 'function') {
                    await window.guardarParadaManualUI();
                }
                window.cerrarModalGestionParadaUI();
            };
        }

        if (typeof window.purgarTodaLaRutaUI !== "function") {
            window.purgarTodaLaRutaUI = async function () {
                if (confirm("⚠️ ¿Está seguro de que desea eliminar TODAS las paradas de la ruta activa?")) {
                    console.log("🗑️ [INMUNIZADOR_INLINE]: Purgando la ruta completa...");
                    if (typeof window.purgarRutaCompleta === 'function') {
                        await window.purgarRutaCompleta();
                    } else if (typeof window.guardarRutaZonificada === 'function') {
                        await window.guardarRutaZonificada([]);
                    }
                    window.__CACHE_PARADAS_MACONDO__ = [];
                    window.paradasMemoriaLocal = [];
                    window.paradasRutaActiva = [];
                    if (typeof window.renderizarConsolaOperaciones === 'function') {
                        await window.renderizarConsolaOperaciones([], 0, 0);
                    }
                }
            };
        }
    })();
</script>
